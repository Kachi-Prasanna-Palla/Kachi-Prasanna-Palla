name: 3d contribution calendar

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
        with:
          SETTING_JSON: |
            { "type": "night-rainbow", "fileName": "profile-night-rainbow.svg" }
      - name: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B output
          mkdir -p profile-3d-contrib
          cp -f profile-3d-contrib/*.svg profile-3d-contrib/ 2>/dev/null || true
          git add profile-3d-contrib
          git commit -m "3d contrib" || exit 0
          git push -f origin output
