name: metrics

# For FULL data (private + org contributions, languages across private repos),
# add a repo secret PROFILE_TOKEN — a classic PAT with scopes: repo, read:org, read:user.
#   github.com/settings/tokens -> Generate new token (classic)
#   repo Settings -> Secrets and variables -> Actions -> New repository secret -> PROFILE_TOKEN
# Without it this still runs, but only sees PUBLIC activity.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          committer_branch: output
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
