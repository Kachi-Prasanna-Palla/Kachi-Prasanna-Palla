name: metrics

# Add a repo secret PROFILE_TOKEN — a classic PAT with scopes: repo, read:org, read:user —
# so private + org contributions and languages across private repos are counted.
# Without it, this still runs but only sees PUBLIC activity.
#   github.com/settings/tokens -> classic -> repo, read:org, read:user
#   repo Settings -> Secrets and variables -> Actions -> PROFILE_TOKEN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          committer_branch: output
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
