name: metrics

# Needs a repo secret METRICS_TOKEN — a classic PAT with scopes: repo, read:org, read:user.
# Create at github.com/settings/tokens -> then Settings -> Secrets and variables -> Actions.
# Dispatch-only until the token exists (so failures don't email you); uncomment the
# schedule block once it's set. The action commits github-metrics.svg to the output branch itself.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          committer_branch: output
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_habits: yes
          config_timezone: Asia/Kolkata
