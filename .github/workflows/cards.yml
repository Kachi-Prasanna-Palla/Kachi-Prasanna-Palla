name: summary cards

# vn7n24fzkq/github-profile-summary-cards (3.6k+ stars) — generates a set of
# profile summary SVGs and commits them to  profile-summary-card-output/<theme>/
# on the `output` branch. PROFILE_TOKEN (classic PAT: repo, read:org, read:user)
# is required for private + org data.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: output
          UTC_OFFSET: 5
          AUTO_PUSH: true
