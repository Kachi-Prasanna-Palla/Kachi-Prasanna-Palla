name: stats cards

# Self-hosted github-readme-stats (Go build, runs in Actions — the free public
# instance is rate-limited/down as of 2026). Commits stats.svg + top-langs.svg to
# the `output` branch. Add PROFILE_TOKEN (classic PAT: repo, read:org, read:user)
# for private + org contribution counts.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
          path: dist/stats.svg
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&bg_color=0D1117&title_color=C9A15A&icon_color=E7D6B8&text_color=C9D1D9

      - name: top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
          path: dist/top-langs.svg
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=C9A15A&text_color=C9D1D9

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
